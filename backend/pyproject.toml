[project]
name = "AI-AIRCRAFT-MAINTENANCE-WEBSITE"
version = "1.0.0"
description = "Aircraft Maintenance Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
